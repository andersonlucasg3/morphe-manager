name: Rebase onto the latest release

# Kept on top of upstream's newest release rather than its dev branch, so a build
# of this fork is the released app plus the in-app APK download and nothing else.
#
# Nothing tells a fork when upstream releases, so the schedule is what actually
# catches it: the dispatch below is here for a caller that already watches
# releases and wants to trigger this one directly. A run that finds nothing to do
# costs about twenty seconds.
on:
  repository_dispatch:
    types: [upstream-release]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebase-onto-release
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    outputs:
      # Empty when the release this branch sits on has already been published
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # checkout fetches only the branch it was asked for, so the fork branch has to be
      # named here or it is not in the working tree for the rebase below
      - name: Fetch the fork branch and upstream releases
        run: |
          git fetch origin feat/in-app-apk-download
          git remote add upstream https://github.com/MorpheApp/morphe-manager.git
          git fetch upstream main --tags

      # The release this fork follows, read from upstream's tags rather than from a branch or
      # from a version in the tree: a tag is the point a version became a release, and it is the
      # one thing here that needs no interpretation. Prereleases carry a suffix (-dev.3 and the
      # like) and are deliberately not followed, because this fork ships releases.
      #
      # Only its version is used. Rebasing onto the tag instead of the branch would be wrong: a
      # release tag sits a commit or two behind the branch, so rebasing onto it would replay
      # upstream's own trailing commits as if they were this fork's.
      - name: Resolve the latest upstream release
        id: release
        run: |
          TAG=$(git tag -l 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$TAG" ]; then
            echo "::error::Upstream has no stable release tag to follow."
            exit 1
          fi
          echo "Latest upstream release: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Rebase the fork branch onto the latest release
        id: rebase
        run: |
          BRANCH=origin/feat/in-app-apk-download
          BASE=upstream/main

          BEHIND=$(git rev-list --count "$BRANCH..$BASE")
          echo "Commits behind upstream: $BEHIND"

          if [ "$BEHIND" = "0" ]; then
            echo "Already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --onto rather than a plain rebase: the branch is pinned to whatever the
          # release was when it was last moved, and everything above that is ours
          git checkout -B feat/in-app-apk-download "$BRANCH"

          # A release that touches a file this branch edits has to be resolved by
          # hand. Aborting leaves the branch where it is, which is the safe half of
          # the outcome: a stale branch still builds, a half-resolved one does not.
          if ! git rebase "$BASE"; then
            git rebase --abort || true
            echo "::error::Rebase onto $BASE hit a conflict. Resolve it locally."
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push
        if: steps.rebase.outputs.changed == 'true'
        run: git push --force-with-lease origin feat/in-app-apk-download

      - name: Check out the rebased branch
        if: steps.rebase.outputs.changed == 'true'
        run: git checkout feat/in-app-apk-download

      - name: Setup Java
        if: steps.rebase.outputs.changed == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        if: steps.rebase.outputs.changed == 'true'
        uses: burrunan/gradle-cache-action@v3

      # A rebase that silently breaks the branch is worse than one that fails, so
      # the branch is only trusted once it has been built on the release it moved to.
      - name: Verify the rebase
        if: steps.rebase.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          _JAVA_OPTIONS: "-Djava.awt.headless=true"
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      # main has to follow the release as well, or a clone of this fork is an old release
      # wearing its name. It is rebuilt on the release rather than rebased onto it: main owns
      # nothing but the two workflows and the JSON the app updates from, so there is nothing
      # here for a release to conflict with. Runs even when the branch needed no move, which is
      # exactly the case that left main behind before.
      - name: Move main onto the same release
        run: |
          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "main already contains $(git rev-parse --short upstream/main)."
            exit 0
          fi

          git fetch origin main
          git checkout -B main upstream/main
          # The paths are named rather than discovered, so a rename fails here instead of
          # silently dropping one of them from main
          git checkout origin/main -- \
            .github/workflows/fork-release.yml \
            .github/workflows/rebase-onto-release.yml \
            app-release.json
          git commit -m "chore: Follow upstream $(git rev-parse --short upstream/main) [skip ci]"
          git push origin main

      # Absorbing a release and leaving it unpublished is the gap this closes. Decided here and
      # published by the reusable workflow below, because a tag pushed with the repository token
      # starts no workflow of its own. Runs whether or not the branch just moved: the release is
      # owed per upstream tag, not per rebase, so a tag absorbed by an earlier run is still owed.
      - name: Decide whether this release still needs publishing
        id: publish
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          BRANCH=feat/in-app-apk-download
          # The branch only exists locally when the rebase step created it
          if git rev-parse --verify --quiet "$BRANCH" >/dev/null; then
            REF="$BRANCH"
          else
            REF="origin/$BRANCH"
          fi

          # A version is released only once the code carrying it is in the branch, so a tag
          # that appeared while a rebase was still pending is not published ahead of it
          if ! git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" "$REF"; then
            echo "The branch has not taken $RELEASE_TAG yet."
            exit 0
          fi

          TAG="v${VERSION}-fork.1"
          echo "Upstream release $RELEASE_TAG would be published as $TAG"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG is already published."
            exit 0
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Rebase onto the latest release"
            echo
            if [ -n "${{ steps.release.outputs.tag }}" ]; then
              echo "Latest upstream release: \`${{ steps.release.outputs.tag }}\`"
            fi
            if [ "${{ steps.rebase.outputs.changed }}" = "true" ]; then
              echo "The branch was moved onto it and verified."
            else
              echo "The branch already contains it."
            fi
            if [ -n "${{ steps.publish.outputs.tag }}" ]; then
              echo
              echo "Publishing \`${{ steps.publish.outputs.tag }}\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: rebase
    if: needs.rebase.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/fork-release.yml
    with:
      tag: ${{ needs.rebase.outputs.tag }}
    secrets: inherit
